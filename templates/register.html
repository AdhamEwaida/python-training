{% extends "base.html" %}

{% block title %}Register | Student Portal{% endblock %}

{% block content %}
  <h1>Register a Student</h1>

  {% if errors %}
    <ul aria-label="Validation errors">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ form.get('name', '') }}" required>

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      value="{{ form.get('email', '') }}"
      required
    >

    <label for="course">Course</label>
    <input
      id="course"
      name="course"
      value="{{ form.get('course', '') }}"
      required
    >

    <button type="submit">Register</button>
  </form>
{% endblock %}
