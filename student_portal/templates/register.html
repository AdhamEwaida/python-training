{% extends "base.html" %}
{% from "macros/ui.html" import render_errors %}

{% block title %}{{ page_title }} | Student Portal{% endblock %}

{% block content %}
  <div class="card border-0 shadow-sm mx-auto" style="max-width: 48rem">
    <div class="card-body p-4 p-md-5">
  <h1 class="h2 mb-4">{{ page_title }}</h1>

  {{ render_errors(errors) }}

  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="name">Name</label>
    <input class="form-control mb-3" id="name" name="name" value="{{ form.get('name', '') }}" required>

    <label class="form-label" for="email">Email</label>
    <input
      class="form-control mb-3"
      id="email"
      name="email"
      type="email"
      value="{{ form.get('email', '') }}"
      required
    >

    <label class="form-label" for="course">Course</label>
    <input
      class="form-control mb-3"
      id="course"
      name="course"
      value="{{ form.get('course', '') }}"
      required
    >

    <label class="form-label" for="grades">Grades</label>
    <input
      class="form-control"
      id="grades"
      name="grades"
      value="{{ form.get('grades', '') }}"
      placeholder="90, 85, 78"
      aria-describedby="grades-help"
    >
    <small class="form-text text-secondary" id="grades-help">
      Optional. Enter comma-separated numbers from 0 to 100.
    </small>

    <div class="mt-4"><button class="btn btn-primary" type="submit">{{ submit_label }}</button></div>
  </form>
    </div>
  </div>
{% endblock %}
