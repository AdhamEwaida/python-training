{% extends "base.html" %}
{% from "macros/ui.html" import render_errors %}

{% block title %}{{ page_title }} | Student Portal{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h2 mb-4">{{ page_title }}</h1>
          {{ render_errors(errors, 'Errors') }}
          <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
              <label class="form-label" for="name">Course name</label>
              <input class="form-control" id="name" name="name" value="{{ name }}" maxlength="120" required>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Save Course</button>
              <a class="btn btn-outline-secondary" href="{{ url_for('courses.course_list') }}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
