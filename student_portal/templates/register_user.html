{% extends "base.html" %}

{% block title %}Create Account | Student Portal{% endblock %}

{% block content %}
  <h1>Create Account</h1>
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <p>
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ username }}" required minlength="3" maxlength="80">
    </p>
    <p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8">
    </p>
    <button type="submit">Create Account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
{% endblock %}
